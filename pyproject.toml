[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlp-gui"
version = "0.1.0"
description = "Desktop front end for yt-dlp with browser-cookie accounts for maximum quality"
requires-python = ">=3.9"
dependencies = ["yt-dlp[default]>=2025.1.1", "PySide6>=6.6", "platformdirs>=4"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller>=6"]

[project.scripts]
ytdlp-gui = "ytdlp_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
